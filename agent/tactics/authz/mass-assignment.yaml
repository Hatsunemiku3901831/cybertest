      "id": "independent-readback",
      "role": "readback",
      "description": "使用独立读取面确认服务端状态是否真实变化。"
    },
    {
      "id": "exact-restore",
      "role": "rollback",
      "description": "恢复精确基线并再次独立回读。"
    }
  ],
  "expected_observations": [
